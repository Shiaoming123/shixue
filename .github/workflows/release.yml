name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release configuration
        run: npm run release:check -- --mode=release

      - name: Record reproducible release source
        run: npm run release:provenance

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名：私钥内容（或路径），公钥需填入 tauri.conf.json 的 plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: '更新内容见 CHANGELOG。'
          releaseDraft: false
          prerelease: false
          args: --bundles nsis,msi
          uploadUpdaterJson: true
          # 让 Windows 优先分发 NSIS 安装包（.exe）而不是 MSI
          updaterJsonPreferNsis: true
          # 中文 productName 在 GitHub asset 名称中会被清洗；使用稳定 ASCII 名称保证签名匹配和 latest.json 生成。
          releaseAssetNamePattern: 'Shixue_[version]_[arch][setup][ext]'
