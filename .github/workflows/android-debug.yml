name: android-debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Android x86_64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: android-actions/setup-android@v4

      - name: Install Android build and emulator components
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;27.1.12297006" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Start isolated Android emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/shixue-android-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name shixue-ci-api35 --package "system-images;android-35;google_apis;x86_64" --device medium_phone
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx shixue-ci-api35
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup "$ANDROID_HOME/emulator/emulator" @shixue-ci-api35 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > "$RUNNER_TEMP/shixue-emulator.log" 2>&1 &
          timeout 180 adb -s emulator-5554 wait-for-device
          timeout 180 bash -c 'until [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          test "$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = "1"

      - run: npm ci
      - run: npm run tauri -- android init --ci
      - name: Build debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: npm run tauri -- android build --debug --target x86_64 --apk

      - name: Verify APK metadata
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$APK"
          npm run check:android-artifact -- --apk "$APK"
          echo "SHIXUE_ANDROID_APK=$APK" >> "$GITHUB_ENV"

      - name: Smoke installed Android launch and readiness
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: npm run smoke:android-launch -- --device emulator-5554 --apk "$GITHUB_WORKSPACE/$SHIXUE_ANDROID_APK" --output src-tauri/target/android-launch/ci.json

      - name: Smoke Android SQLite persistence across process restart
        timeout-minutes: 3
        run: npm run smoke:android-persistence -- --device emulator-5554 --launch-report "$GITHUB_WORKSPACE/src-tauri/target/android-launch/ci.json" --output src-tauri/target/android-persistence/ci.json

      - name: Smoke Android learning UI and process restart
        timeout-minutes: 5
        run: node scripts/smoke-android-learning-loop.mjs --device emulator-5554 --launch-report "$GITHUB_WORKSPACE/src-tauri/target/android-launch/ci.json" --output src-tauri/target/android-learning-loop/ci.json

      - name: Capture Android diagnostics
        if: always()
        run: |
          mkdir -p src-tauri/target/android-launch src-tauri/target/android-persistence
          timeout 30 adb -s emulator-5554 logcat -d -t 1000 > src-tauri/target/android-launch/logcat.txt || true
          cp "$RUNNER_TEMP/shixue-emulator.log" src-tauri/target/android-launch/emulator.log || true

      - name: Stop Android emulator
        if: always()
        run: timeout 30 adb -s emulator-5554 emu kill || true

      - uses: actions/upload-artifact@v4
        with:
          name: shixue-android-x86_64-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shixue-android-emulator-evidence
          path: |
            src-tauri/target/android-launch/
            src-tauri/target/android-persistence/
            src-tauri/target/android-learning-loop/
          if-no-files-found: error
